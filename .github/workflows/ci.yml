name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: web
          push: false
          tags: ledgerline/web:ci

      - name: Build workflow worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: worker
          push: false
          tags: ledgerline/worker:ci

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migration
          push: false
          tags: ledgerline/migration:ci

      - name: Set up Bicep
        uses: anthony-c-martin/setup-bicep@v1
        with:
          version: 0.47.16

      - name: Compile Bicep
        run: bicep build infra/main.bicep --outfile /tmp/ledgerline-main.json

      - name: Lint Bicep
        run: bicep lint infra/main.bicep
